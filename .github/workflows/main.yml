name: Build Open Screen Recorder
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Ensure Brand Icon Exists
        shell: pwsh
        run: if (-not (Test-Path ./brand/logo.ico)) { New-Item -ItemType Directory -Force -Path ./brand | Out-Null; [IO.File]::WriteAllBytes("./brand/logo.ico", [Convert]::FromBase64String("")) }
      - name: Publish Single-File EXE
        shell: pwsh
        run: dotnet publish OpenScreenRecorder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish
      - name: Bundle Offline FFmpeg
        shell: pwsh
        run: if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { Copy-Item (Get-Command ffmpeg).Source ./publish/ffmpeg.exe -Force }
      - name: Run Self-Check and Generate NSIS Script
        shell: pwsh
        run: ./publish/OpenScreenRecorder.exe --self-check
      - name: Build 1 - Create Portable EXE and ZIP
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ./dist/Portable/brand, ./dist/Output | Out-Null; Copy-Item ./publish/* ./dist/Portable/ -Force; if (Test-Path ./brand/*) { Copy-Item ./brand/* ./dist/Portable/brand/ -Force }; Set-Content -Path ./dist/Portable/Portable.db -Value "PORTABLE=1" -Encoding UTF8; Copy-Item ./publish/OpenScreenRecorder.exe ./dist/Output/OpenScreenRecorder_Portable.exe -Force; Compress-Archive -Path ./dist/Portable/* -DestinationPath ./dist/Output/OpenScreenRecorder_Portable.zip -Force
      - name: Build 2 - Create Direct Install Setup EXE
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path ./dist/InstallerPayload/brand, ./dist/Output | Out-Null; Copy-Item ./publish/* ./dist/InstallerPayload/ -Force; if (Test-Path ./brand/*) { Copy-Item ./brand/* ./dist/InstallerPayload/brand/ -Force }; if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) { choco install nsis -y --no-progress }; & "C:\Program Files (x86)\NSIS\makensis.exe" ./installer.nsi
      - name: Upload Direct Install Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenRecorder-Direct-Installer-EXE
          path: ./dist/Output/OpenScreenRecorder_Setup.exe
      - name: Upload Portable EXE and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenRecorder-Portable
          path: ./dist/Output/OpenScreenRecorder_Portable.*
      - name: Publish EXE Files to GitHub Releases Automatically
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view v2.0.0 2>$null; if ($LASTEXITCODE -ne 0) { gh release create v2.0.0 --title "Open Screen Recorder v2.0" --notes "Official Installer EXE and Portable Release by Graphicarray" }; gh release upload v2.0.0 ./dist/Output/OpenScreenRecorder_Setup.exe ./dist/Output/OpenScreenRecorder_Portable.exe ./dist/Output/OpenScreenRecorder_Portable.zip --clobber
