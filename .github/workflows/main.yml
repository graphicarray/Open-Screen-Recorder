name: Build Open Screen Recorder EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single-File EXE
        run: dotnet publish OpenScreenRecorder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Run Self-Check Tests
        run: ./publish/OpenScreenRecorder.exe --self-check

      - name: Upload OpenScreenRecorder EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenScreenRecorder-win-x64
          path: |
            ./publish/OpenScreenRecorder.exe
